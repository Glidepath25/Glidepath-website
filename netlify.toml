
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[redirects]]
  from = "https://www.glidepathsolutions.co.uk/*"
  to = "https://glidepathsolutions.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/cms"
  to = "/admin/"
  status = 301
