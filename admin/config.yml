
backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "content/home.json"
        description: "Editable homepage sections used by the main landing page."
        fields:
          - label: "Homepage section order"
            name: "section_order"
            widget: "list"
            hint: "Drag to reorder the main homepage sections shown after the hero."
            field:
              label: "Section"
              name: "section"
              widget: "select"
              options:
                - { label: "Overview and service cards", value: "services" }
                - { label: "Partnership section", value: "partnership" }
                - { label: "Testimonials", value: "testimonials" }
                - { label: "Latest updates", value: "updates" }
                - { label: "CTA band", value: "cta" }
                - { label: "Contact section", value: "contact" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "Primary button label", name: "primary_label", widget: "string"}
              - {label: "Primary button link", name: "primary_href", widget: "string"}
              - {label: "Secondary button label", name: "secondary_label", widget: "string"}
              - {label: "Secondary button link", name: "secondary_href", widget: "string"}
              - {label: "Panel label", name: "panel_label", widget: "string"}
              - {label: "Panel title", name: "panel_title", widget: "string"}
              - {label: "Panel body", name: "panel_body", widget: "text"}
              - label: "Checklist"
                name: "checklist"
                widget: "list"
                field: {label: "Item", name: "item", widget: "string"}
              - label: "Stats"
                name: "stats"
                widget: "list"
                summary: "{{fields.value}} - {{fields.label}}"
                fields:
                  - {label: "Value", name: "value", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
          - label: "Overview"
            name: "overview"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
          - label: "Client Logos"
            name: "client_logos"
            widget: "list"
            summary: "{{fields.logo}}"
            fields:
              - {label: "Logo", name: "logo", widget: "image", choose_url: false}
          - label: "Service cards"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
          - label: "Partnership section"
            name: "partnership"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "Link label", name: "link_label", widget: "string"}
              - {label: "Link href", name: "link_href", widget: "string"}
              - {label: "Panel title", name: "panel_title", widget: "string"}
              - label: "Panel points"
                name: "points"
                widget: "list"
                field: {label: "Point", name: "point", widget: "string"}
              - label: "Badges"
                name: "badges"
                widget: "list"
                field: {label: "Badge", name: "badge", widget: "string"}
          - label: "Testimonials"
            name: "testimonials"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.attribution}}"
                fields:
                  - {label: "Quote", name: "quote", widget: "text"}
                  - {label: "Attribution", name: "attribution", widget: "string"}
          - label: "CTA band"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - label: "Checklist"
                name: "checklist"
                widget: "list"
                field: {label: "Item", name: "item", widget: "string"}
              - {label: "Button label", name: "label", widget: "string"}
              - {label: "Button href", name: "href", widget: "string"}
          - label: "Contact section"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - {label: "Email label", name: "email_label", widget: "string"}
              - {label: "Email address", name: "email", widget: "string"}
              - {label: "Card title", name: "card_title", widget: "string"}
              - label: "Card points"
                name: "card_points"
                widget: "list"
                field: {label: "Point", name: "point", widget: "string"}
  - name: "updates"
    label: "Updates / Blog"
    label_singular: "Update"
    files:
      - name: "posts"
        label: "Posts List"
        file: "content/posts.json"
        description: "List of update cards displayed on the site."
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Slug", name: "slug", widget: "string", hint: "Unique short ID for the URL, e.g. built-for-utilities", pattern: ["^[a-z0-9]+[a-z0-9-]*$", "Use lowercase letters, numbers and hyphens only."]}
              - {label: "Date", name: "date", widget: "datetime"}
              - {label: "Summary", name: "summary", widget: "text"}
              - {label: "Image", name: "image", widget: "image", choose_url: false, required: false}
              - label: "Image width (%)"
                name: "image_width"
                widget: "number"
                value_type: "int"
                min: 10
                max: 100
                required: false
                hint: "Optional: set a width between 10 and 100 to display the image narrower than full width."
              - {label: "LinkedIn or URL", name: "link", widget: "string"}
  - name: "services_page"
    label: "Services Page"
    files:
      - name: "services"
        label: "Services Page Content"
        file: "content/services.json"
        description: "Editable content used by the consultancy and software page."
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Summary", name: "summary", widget: "text"}
          - label: "Consultancy section"
            name: "consultancy"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
          - label: "Software section"
            name: "software"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Products"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Summary", name: "summary", widget: "text"}
                  - {label: "Capabilities heading", name: "capabilities_heading", widget: "string"}
                  - label: "Capabilities"
                    name: "capabilities"
                    widget: "list"
                    field: {label: "Capability", name: "capability", widget: "string"}
                  - {label: "Closing paragraph", name: "closing", widget: "text"}
                  - {label: "Primary button label", name: "primary_label", widget: "string", required: false}
                  - {label: "Primary button link", name: "primary_href", widget: "string", required: false}
                  - {label: "Secondary button label", name: "secondary_label", widget: "string", required: false}
                  - {label: "Secondary button link", name: "secondary_href", widget: "string", required: false}
                  - {label: "Poster image", name: "poster", widget: "image", choose_url: false, required: false}
                  - {label: "Video path", name: "video_src", widget: "string", required: false}
